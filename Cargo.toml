[package]
name = "luavortex"
version = "0.2.0"
edition = "2021"
description = "A Lua 5.4 frontend for the VORTEX JIT runtime — written in Rust"
license = "Apache-2.0"
repository = "https://github.com/AVmakeralt/luajit-2"

[[bin]]
name = "luavortex"
path = "src/main.rs"

[lib]
name = "luavortex"
path = "src/lib.rs"

[dependencies]
vortex-jit = { git = "https://github.com/AVmakeralt/VORTEX", branch = "main" }
libc = "0.2"

[build-dependencies]
cc = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
